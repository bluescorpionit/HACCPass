name: haccpass
description: App HACCP locale per smartphone e tablet, senza server.
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^11.0.0
  path_provider: ^2.1.5
  file_picker: ^10.1.9
  in_app_purchase: ^3.2.3
  crypto: ^3.0.6
  meta: ^1.18.0
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  cryptography: ^2.9.0
  workmanager: ^0.10.10
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1
  mobile_scanner: ^7.4.2
  flutter_contacts: ^2.6.0
  archive: ^4.3.0
  url_launcher: ^6.3.3
  # Factory FFI del DB: necessaria a runtime su desktop (Windows/Linux).
  sqflite_common_ffi: ^2.4.3
  flutter_blue_plus: ^2.3.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

